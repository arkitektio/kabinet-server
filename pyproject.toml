[project]
name = "kabinet-server"
version = "2.0.0"
description = ""
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "django>=5.2",
    "pydantic-settings[yaml]>=2.2",
    "psycopg[binary]>=3",
    "daphne>=4.0.0,<5",
    "channels-redis>=4.1.0,<5",
    "django-choices-field>=2.2.2,<3",
    "authentikate>=2.2.1",
    "ujson>=5.8.0,<6",
    "aioredis>=2.0.1,<3",
    "jsonpatch~=1.33",
    "django-probes>=1.7.0,<2",
    "rich>=14.0.0",
    "koherent>4",
    "django-redis>=5.4.0",
    "boto3>=1.38.9",
    "aiohttp>=3.11.18",
    "semver>=3.0.4",
    "django-health-check>=3.20.0",
    "kante>=2.0.1",
    "whitenoise>=6.6",
    "django-polymorphic>=4.1.0",
    "pint>=0.25.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=9.21.0",
    "dokker>=2.5",
    "moto>=5.1.11",
    "pytest-asyncio>=1.1.0",
    "pytest-django>=4.11.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kabinet_server.settings_test"


[tool.ruff]
# `E` (pycodestyle) and `F` (pyflakes) are ruff's default select and are the CI gate:
# `.github/workflows/lint.yaml` runs them as a required check. `ANN` and `D1` are
# aspirational -- they flag every missing annotation and docstring in the tree, which is
# a backlog rather than a regression, so they run advisory in the same workflow.
#
# These used to sit as top-level `extend-select`/`extend-ignore`, which ruff deprecated
# in favour of the `lint` section and warned about on every invocation.

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "tests",
    "examples",
    "**/migrations",
]

# Same as Black.
line-length = 300


# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
extend-select = ["ANN", "D1"]
extend-ignore = ["ANN002", "ANN003", "D100", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# `rekuest_core` is vendored from the rekuest service and has already drifted from the
# upstream copy. Its long lines are single-line field descriptions that render into the
# public schema; rewrapping them would widen the drift for no behavioural gain.
"rekuest_core/**" = ["E501"]


[tool.semantic_release]
# This server is deployed as Docker images, not a PyPI package — so a release
# just bumps the version, writes the changelog, tags, and cuts a GitHub Release.
# No wheel is built and nothing is uploaded to PyPI.
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = false
build_command = ""
commit_message = "chore(release): v{version} [skip ci]"

# main -> stable X.Y.Z releases. next -> prereleases X.Y.Z-rc.N.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main — e.g. 1.5.3 off `1.x`
# while main is on 2.x. The regex is reused for every future major's line.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog / release notes focused on user-facing changes. These
# patterns only filter what's rendered — they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ', # includes the chore(release): … bump commit
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]



[tool.basedpyright]
# Scoped to the code this service owns. `rekuest_core` is vendored from the rekuest
# service and `*/migrations` are generated, so neither is this repo's to fix.
include = ["bridge", "datalayer", "kabinet_server"]
exclude = ["**/migrations", "**/__pycache__", ".venv"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# `[tool.mypy]` used to sit here with `strict = true`, `ignore_missing_imports`, the
# django-stubs and pydantic plugins -- and no workflow that ran it. A standard nothing
# checks is not a standard. basedpyright is the checker CI actually invokes
# (.github/workflows/typecheck.yaml); mypy and its plugins are gone with it.
