name: Type Check

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  basedpyright:
    name: basedpyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      # Advisory for now. This comment used to claim basedpyright was "scoped to the
      # typed facade/ plumbing modules via [tool.basedpyright] in pyproject.toml" --
      # there was no such section, and there is no facade/ in this repo; it ran unscoped
      # over the whole tree with its output discarded. It is scoped now, to the code this
      # service owns. Drop `continue-on-error` to make it required.
      - name: Run basedpyright
        run: uv run basedpyright
        continue-on-error: true
